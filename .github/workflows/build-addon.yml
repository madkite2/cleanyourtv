name: Build add-on APK

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Part of the add-on folder name (e.g. capacity)'
        required: true
        default: 'capacity'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: List add-ons
        run: ls -la addons

      - name: Find add-on project
        id: find
        env:
          NAME: ${{ github.event.inputs.name }}
        run: |
          DIR=$(find addons -maxdepth 2 -type d -iname "*${NAME}*" | head -n1)
          echo "Add-on folder: $DIR"
          [ -n "$DIR" ] || { echo "No folder matches '$NAME'"; exit 1; }
          GRADLE=$(find "$DIR" -maxdepth 3 -name "settings.gradle*" | head -n1)
          echo "Gradle settings: $GRADLE"
          [ -n "$GRADLE" ] || { echo "No gradle project found"; ls -R "$DIR"; exit 1; }
          echo "proj=$(dirname "$GRADLE")" >> "$GITHUB_OUTPUT"

      - name: Use permanent signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2
          else
            echo "::warning::KEYSTORE_B64 secret is empty, APK gets a random key"
          fi

      - name: Build
        working-directory: ${{ steps.find.outputs.proj }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        env:
          PROJ: ${{ steps.find.outputs.proj }}
          NAME: ${{ github.event.inputs.name }}
        run: |
          APK=$(find "$PROJ" -path "*outputs/apk*" -name "*.apk" | head -n1)
          echo "APK: $APK"
          cp "$APK" "addon-${NAME}.apk"
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -n1)
          $AAPT dump badging "addon-${NAME}.apk" | grep -E "^package:" || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.inputs.name }}
        run: |
          gh release delete "addon-${NAME}" -y --cleanup-tag || true
          gh release create "addon-${NAME}" "addon-${NAME}.apk" --title "Add-on ${NAME}" --notes "Debug build"
