name: Build launcher APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show launcher folder
        run: ls -la launcher launcher/app || true

      - name: Apply Glass theme settings
        run: |
          F=launcher/app/src/main/res/values/config.xml
          setb() { sed -i -E "s|(<bool name=\"$1\">)[^<]*(</bool>)|\1$2\2|" "$F"; }
          setb cinematic_home true
          setb dock_glass true
          setb icon_only_buttons true
          setb show_inputs_pill false
          setb app_glow true
          setb focus_overshoot false
          setb advanced_effects true
          setb show_stats true
          sed -i -E 's|(<string name="glow_style" translatable="false">)[^<]*|\1horizon|' "$F"
          grep -E 'name="(cinematic_home|dock_glass|icon_only_buttons|show_inputs_pill|app_glow|focus_overshoot|advanced_effects|show_stats|glow_style)"' "$F"

      - name: Build
        working-directory: launcher
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK and print package name
        run: |
          APK=$(find launcher -path "*outputs/apk*" -name "*.apk" | head -n1)
          echo "APK: $APK"
          cp "$APK" cleanyourtv.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -n1)
          $AAPT dump badging cleanyourtv.apk | grep -E "^package:" || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest cleanyourtv.apk --title "CleanYourTV launcher" --notes "Debug build"
